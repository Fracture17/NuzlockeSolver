[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"  # off, basic, standard, strict
include = ["src"]
exclude = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
severity = "medium"
confidence = "medium"